# RepoClean GitHub Action for musonzahw/php-BE (master)
# Supports:
#   1. commit-skip-deploy: Applies .repoclean/repoclean.patch (if present) or runs the reviewed cleanup rules,
#      then commits & pushes with "[skip ci] [skip deploy]" so your actual GitHub repo is cleaned without redeploying
#      on Render or Vercel (with Ignored Build Step). On Cloudflare Workers, pause Git builds before running.
#   2. dry-run: Previews what would be pruned/cleaned without modifying or committing anything.
#   3. workspace-only: Cleans runner workspace only without committing (useful before a build step).

name: RepoClean Cleanup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Cleanup mode"
        required: true
        default: "commit-skip-deploy"
        type: choice
        options:
          - "commit-skip-deploy"
          - "dry-run"
          - "workspace-only"
      patch_path:
        description: "Optional .patch file path in repo (if uploaded)"
        required: false
        default: ".repoclean/repoclean.patch"
        type: string

jobs:
  repoclean:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run RepoClean cleanup
        env:
          CLEAN_MODE: ${{ inputs.mode || 'commit-skip-deploy' }}
          PATCH_PATH: ${{ inputs.patch_path || '.repoclean/repoclean.patch' }}
        run: |
          cat <<'EOF' > /tmp/repoclean_config.json
          {
            "repository": "musonzahw/php-BE",
            "branch": "master",
            "prune_paths": [],
            "skip_paths": [],
            "options": {
              "remove_comments": true,
              "strip_docstrings": false,
              "keep_license_headers": true,
              "keep_linter_directives": true,
              "format_code": true,
              "max_blank_lines": 1,
              "format_json": true
            },
            "unused_imports_count": 0
          }
          EOF

          if [ "$CLEAN_MODE" != "dry-run" ] && [ -n "$PATCH_PATH" ] && [ -f "$PATCH_PATH" ]; then
            echo "Applying reviewed patch: $PATCH_PATH"
            git apply --whitespace=nowarn "$PATCH_PATH"
            rm -f "$PATCH_PATH"
            rmdir "$(dirname "$PATCH_PATH")" 2>/dev/null || true
            python3 - <<'PY'
          import json, os
          with open("/tmp/repoclean_config.json", "r", encoding="utf-8") as fh:
              cfg = json.load(fh)
          removed_bin = 0
          for rel in cfg["prune_paths"]:
              if os.path.isfile(rel):
                  os.remove(rel)
                  removed_bin += 1
          summary_md = (
              f"### RepoClean Patch Applied ({cfg['repository']})\n"
              f"- Applied uploaded `.patch` file and removed it from the tree\n"
              f"- Additional redundant/binary files removed: **{removed_bin}**\n"
          )
          print(summary_md)
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as sf:
                  sf.write(summary_md)
          PY
          else
            python3 - <<'PY'
          import io, json, os, re, tokenize

          with open("/tmp/repoclean_config.json", "r", encoding="utf-8") as fh:
              cfg = json.load(fh)

          dry_run = os.environ.get("CLEAN_MODE", "commit-skip-deploy") == "dry-run"
          opts = cfg["options"]
          skip_set = set(cfg["skip_paths"])
          pruned = 0
          cleaned_files = 0
          comments_stripped = 0

          DIRECTIVES = (
              "noqa", "type:", "pragma:", "pylint:", "fmt:", "isort:", "mypy:",
              "eslint-", "@ts-", "prettier-ignore", "biome-ignore", "webpack",
          )
          LICENSES = ("spdx-license-identifier", "copyright", "licensed under", "mit license", "apache license")

          def keep_comment(text, line_no):
              low = text.lower()
              if opts["keep_license_headers"] and line_no <= 20 and any(k in low for k in LICENSES):
                  return True
              if opts["keep_linter_directives"] and any(d in low for d in DIRECTIVES):
                  return True
              return False

          def strip_py(src):
              count = 0
              lines = src.splitlines(keepends=True)
              spans = []
              try:
                  for tok in tokenize.generate_tokens(io.StringIO(src).readline):
                      if tok.type == tokenize.COMMENT and not keep_comment(tok.string, tok.start[0]):
                          spans.append((tok.start[0] - 1, tok.start[1], tok.end[0] - 1, tok.end[1]))
              except (tokenize.TokenError, IndentationError):
                  return src, 0
              if not spans:
                  return src, 0
              out = list(lines)
              for sr, sc, er, ec in sorted(spans, reverse=True):
                  if sr == er:
                      line = out[sr]
                      eol = "\n" if line.endswith("\n") else ""
                      body = line[:-1] if eol else line
                      merged = (body[:sc].rstrip() + body[ec:])
                      out[sr] = "" if (body[:sc].strip() == "" and body[ec:].strip() == "") else merged + eol
                      count += 1
              return "".join(out), count

          def strip_hash(src, is_php=False):
              out, count = [], 0
              for idx, line in enumerate(src.splitlines(keepends=True)):
                  if idx == 0 and line.startswith("#!"):
                      out.append(line); continue
                  in_s, in_d, esc, cidx = False, False, False, None
                  for i, ch in enumerate(line):
                      if esc: esc = False; continue
                      if ch == chr(92) and (in_s or in_d): esc = True; continue
                      if ch == "'" and not in_d: in_s = not in_s; continue
                      if ch == '"' and not in_s: in_d = not in_d; continue
                      if ch == "#" and not in_s and not in_d:
                          if is_php:
                              nxt = line[i + 1] if i + 1 < len(line) else ""
                              if nxt == "[" or (i > 0 and line[i - 1] not in (" ", "\t", ";")):
                                  continue
                              if nxt not in (" ", "\t", "\r", "\n", ""):
                                  continue
                          elif i > 0 and line[i - 1] not in (" ", "\t", ";"):
                              continue
                          cidx = i; break
                  if cidx is None:
                      out.append(line); continue
                  ctxt = line[cidx:]
                  if keep_comment(ctxt, idx + 1):
                      out.append(line); continue
                  count += 1
                  pref = line[:cidx]
                  if pref.strip() == "":
                      continue
                  eol = "\n" if line.endswith("\n") else ""
                  out.append(pref.rstrip(" \t") + eol)
              return "".join(out), count

          def strip_c_style(src, is_js_ts=False):
              out = []
              i, n, line_no, count = 0, len(src), 1, 0
              while i < n:
                  ch = src[i]
                  if ch in ('"', "'") or (is_js_ts and ch == "`"):
                      q = ch
                      out.append(ch); i += 1
                      while i < n:
                          c = src[i]; out.append(c)
                          if c == "\n": line_no += 1
                          if c == chr(92) and i + 1 < n:
                              out.append(src[i + 1]); i += 2; continue
                          i += 1
                          if c == q: break
                      continue
                  if src.startswith("//", i):
                      end = src.find("\n", i)
                      if end == -1: end = n
                      txt = src[i:end]
                      if keep_comment(txt, line_no):
                          out.append(txt); i = end
                      else:
                          count += 1
                          ls = len(out)
                          while ls > 0 and out[ls - 1] != "\n": ls -= 1
                          pref = "".join(out[ls:])
                          if pref.strip() == "":
                              del out[ls:]
                              if end < n and src[end] == "\n":
                                  line_no += 1; i = end + 1
                              else:
                                  i = end
                          else:
                              del out[ls:]; out.append(pref.rstrip(" \t")); i = end
                      continue
                  if src.startswith("/*", i):
                      end = src.find("*/", i + 2)
                      end = n - 2 if end == -1 else end
                      txt = src[i:end + 2]
                      is_doc = txt.startswith("/**") and not txt.startswith("/***")
                      if (is_doc and not opts["strip_docstrings"] and is_js_ts) or keep_comment(txt, line_no):
                          out.append(txt); line_no += txt.count("\n"); i = end + 2
                      else:
                          count += 1
                          line_no += txt.count("\n")
                          ls = len(out)
                          while ls > 0 and out[ls - 1] != "\n": ls -= 1
                          pref = "".join(out[ls:])
                          after = end + 2
                          rend = src.find("\n", after)
                          if rend == -1: rend = n
                          rest = src[after:rend]
                          if pref.strip() == "" and rest.strip() == "":
                              del out[ls:]
                              if rend < n and src[rend] == "\n":
                                  line_no += 1; i = rend + 1
                              else:
                                  i = rend
                          else:
                              i = after
                      continue
                  if ch == "\n": line_no += 1
                  out.append(ch); i += 1
              return "".join(out), count

          def strip_html(src):
              count = 0
              def repl(m):
                  nonlocal count
                  t = m.group(0)
                  if opts["keep_license_headers"] and any(k in t.lower() for k in LICENSES):
                      return t
                  count += 1
                  return ""
              return re.sub(r"<!--[\s\S]*?-->", repl, src), count

          def strip_sql(src):
              out, count = [], 0
              for idx, line in enumerate(src.splitlines(keepends=True)):
                  in_s, i = False, 0
                  cidx = None
                  while i < len(line):
                      if line[i] == "'": in_s = not in_s
                      elif not in_s and line.startswith("--", i):
                          cidx = i; break
                      i += 1
                  if cidx is None or keep_comment(line[cidx:], idx + 1):
                      out.append(line); continue
                  count += 1
                  pref = line[:cidx]
                  if pref.strip() == "": continue
                  eol = "\n" if line.endswith("\n") else ""
                  out.append(pref.rstrip(" \t") + eol)
              return "".join(out), count

          for rel in cfg["prune_paths"]:
              if os.path.isfile(rel):
                  pruned += 1
                  if not dry_run:
                      os.remove(rel)

          JS_EXTS = set([".ts", ".tsx", ".mts", ".cts", ".js", ".jsx", ".mjs", ".cjs"])
          C_EXTS = set([".php", ".css", ".scss", ".less", ".go", ".rs", ".java", ".c", ".h", ".cpp", ".cc", ".hpp", ".cs", ".swift", ".kt", ".jsonc"])
          HASH_EXTS = set([".sh", ".bash", ".zsh", ".yml", ".yaml", ".toml", ".ini", ".cfg", ".rb"])
          HTML_EXTS = set([".html", ".htm", ".xml", ".svg", ".vue", ".svelte", ".md", ".mdx"])
          ALL_EXTS = set([".py", ".json", ".sql", ".txt"]) | JS_EXTS | C_EXTS | HASH_EXTS | HTML_EXTS

          if opts["remove_comments"] or opts["format_code"]:
              for root, dirs, files in os.walk("."):
                  dirs[:] = [d for d in dirs if d not in (".git", ".github", "node_modules", ".next", "__pycache__", "vendor")]
                  for fn in files:
                      rel = os.path.relpath(os.path.join(root, fn), ".").replace(os.sep, "/")
                      if rel in skip_set:
                          continue
                      ext = os.path.splitext(fn)[1].lower()
                      if ext not in ALL_EXTS:
                          continue
                      try:
                          with open(rel, "r", encoding="utf-8") as fh:
                              orig = fh.read()
                      except UnicodeDecodeError:
                          continue
                      text = orig
                      if opts["remove_comments"]:
                          if ext == ".py":
                              text, c = strip_py(text); comments_stripped += c
                          elif ext in JS_EXTS:
                              text, c = strip_c_style(text, is_js_ts=True); comments_stripped += c
                          elif ext == ".php":
                              text, c = strip_c_style(text, is_js_ts=False); comments_stripped += c
                              text, c2 = strip_hash(text, is_php=True); comments_stripped += c2
                          elif ext in C_EXTS:
                              text, c = strip_c_style(text, is_js_ts=False); comments_stripped += c
                          elif ext in HASH_EXTS:
                              text, c = strip_hash(text, is_php=False); comments_stripped += c
                          elif ext in HTML_EXTS:
                              text, c = strip_html(text); comments_stripped += c
                          elif ext == ".sql":
                              text, c = strip_sql(text); comments_stripped += c
                      if opts["format_json"] and ext == ".json":
                          try:
                              text = json.dumps(json.loads(text), indent=2) + "\n"
                          except Exception:
                              pass
                      elif opts["format_code"]:
                          text = text.replace("\r\n", "\n").replace("\r", "\n")
                          lines = [ln.rstrip() for ln in text.splitlines()]
                          text = "\n".join(lines).rstrip("\n") + "\n" if lines else ""
                          max_bl = max(0, int(opts["max_blank_lines"]))
                          text = re.sub(r"\n(' + str(max_bl + 2) + r',)", "\n" * (max_bl + 1), text)
                      if text != orig:
                          cleaned_files += 1
                          if not dry_run:
                              with open(rel, "w", encoding="utf-8") as fh:
                                  fh.write(text)

          summary_md = (
              f"### RepoClean Summary ({cfg['repository']})\n"
              f"- Mode: **{os.environ.get('CLEAN_MODE')}**\n"
              f"- Redundant files pruned: **{pruned}**\n"
              f"- Source files cleaned: **{cleaned_files}**\n"
              f"- Comments stripped: **{comments_stripped}**\n"
              f"- Unused Python imports flagged during review: **{cfg['unused_imports_count']}**\n"
          )
          print(summary_md)
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a", encoding="utf-8") as sf:
                  sf.write(summary_md)
          PY
          fi

      - name: Commit and push cleaned files (skip CI/deploy)
        if: ${{ (inputs.mode || 'commit-skip-deploy') == 'commit-skip-deploy' }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Repository already clean; nothing to commit."
            exit 0
          fi
          git config user.name "repoclean-bot"
          git config user.email "repoclean-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: repo cleanup [skip ci] [skip deploy]"
          git push
